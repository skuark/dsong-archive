<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisar MusicBrainz · dSong</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e2e0da; --accent: #c2410c; --ok: #15803d; --no: #b91c1c; --warn: #b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --card: #202020; --text: #ececec; --muted: #9a9a9f; --line: #333; --accent: #fb923c; --ok: #4ade80; --no: #f87171; --warn: #fbbf24; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; }
  .stats { color: var(--muted); font-variant-numeric: tabular-nums; }
  select, input, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { font-size: 22px; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 16px; }
  .meta b { color: var(--text); font-weight: 500; }
  a { color: var(--accent); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; font-size: 12px; margin-left: 6px; vertical-align: middle; font-weight: 500; }
  .badge.ok { color: var(--ok); } .badge.no { color: var(--no); } .badge.warn { color: var(--warn); }
  .cands { display: flex; flex-direction: column; gap: 10px; }
  .cand { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; }
  .cand.chosen { border-color: var(--ok); }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .confirmed { color: var(--ok); font-size: 13px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .actions input { flex: 1; min-width: 260px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 18px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .msg { color: var(--no); font-size: 13px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .diff { color: var(--warn); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>MusicBrainz</h1>
  <div class="tabs"><button data-kind="artists">Artistas</button><button data-kind="posts">Canciones</button></div>
  <select id="filter">
    <option value="pending">Pendientes</option>
    <option value="decided">Ya revisados</option>
    <option value="auto">Automáticos</option>
    <option value="all">Todos</option>
  </select>
  <span class="stats" id="stats"></span>
</header>
<main id="main"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s = "") => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const MB = "https://musicbrainz.org/";
const UUID = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/;
const norm = (s) => (s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim().replace(/^the /, "");
const mmss = (ms) => ms ? `${Math.floor(ms / 60000)}:${String(Math.round(ms / 1000) % 60).padStart(2, "0")}` : "";
let data = { artists: { results: {}, decisions: {} }, posts: { results: {}, decisions: {} } };
let kind = new URLSearchParams(location.search).get("kind") === "posts" ? "posts" : "artists";
let keys = [], index = 0, current = null;
const R = () => data[kind].results, D = () => data[kind].decisions;
const valueOf = (d) => (kind === "artists" ? d.mbid : d.pick);

function list() {
  const f = $("#filter").value, results = R(), decisions = D();
  return Object.keys(results).filter((k) => {
    const r = results[k], d = k in decisions;
    if (f === "pending") return r.status === "review" && !d;
    if (f === "decided") return d;
    if (f === "auto") return r.status === "auto";
    return true;
  // Artists with most posts first; posts in date order (ids start with the date).
  }).sort(kind === "artists" ? (a, b) => results[b].posts - results[a].posts || a.localeCompare(b) : (a, b) => a.localeCompare(b));
}

async function load() {
  data = await (await fetch("/api/data")).json();
  keys = list();
  index = current && keys.includes(current) ? keys.indexOf(current) : Math.min(index, Math.max(keys.length - 1, 0));
  tabs(); stats(); render();
}

function tabs() {
  document.querySelectorAll("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === kind));
}

function stats() {
  const results = R(), all = Object.values(results), decisions = D();
  const left = Object.keys(results).filter((k) => results[k].status === "review" && !(k in decisions)).length;
  const noun = kind === "artists" ? "artistas" : "artículos";
  $("#stats").textContent = `${left} por revisar · ${Object.keys(decisions).length} decisiones · ${all.filter((r) => r.status === "auto").length} automáticos · ${all.length} ${noun}`;
}

const chosenOf = (k) => (k in D() ? valueOf(D()[k]) : R()[k].status === "auto" ? R()[k].pick : undefined);

function badge(k) {
  const r = R()[k];
  return k in D() ? (valueOf(D()[k]) ? `<span class="badge ok">elegido</span>` : `<span class="badge no">sin coincidencia</span>`)
    : r.status === "auto" ? `<span class="badge ok">automático${r.via === "content" ? " (por el texto)" : ""}</span>` : `<span class="badge warn">por revisar</span>`;
}

function artistView(k, r, chosen) {
  const q = encodeURIComponent(r.names[0]);
  return {
    head: `<h2>${esc(r.names.join(" · "))} ${badge(k)}</h2>
      <p class="meta">${index + 1} de ${keys.length} · <b>${r.posts}</b> ${r.posts === 1 ? "artículo" : "artículos"}
        ${r.nationality.length ? ` · ${esc(r.nationality.join(", "))}` : ""}
        · <a href="${MB}search?type=artist&query=${q}" target="_blank" rel="noopener">buscar en MusicBrainz</a></p>
      <p class="meta">Canciones: <b>${esc(r.songs.join(" · ") || "—")}</b><br>Discos: <b>${esc(r.albums.join(" · ") || "—")}</b></p>`,
    cands: r.candidates.map((c, i) => ({ value: c.mbid, chosen: c.mbid === chosen, html: `
      <div><span class="name">${esc(c.name)}</span> <a href="${MB}artist/${c.mbid}" target="_blank" rel="noopener">↗</a>
        ${c.sameName ? "" : `<span class="badge warn">otro nombre</span>`}</div>
      <div class="sub">${[c.disambiguation, c.type, c.area ?? c.country, [c.begin, c.end].filter(Boolean).join("–"), c.score != null && `puntuación ${c.score}`].filter(Boolean).map(esc).join(" · ")}</div>
      ${c.confirmed.length ? `<div class="confirmed">✓ ${esc(c.confirmed.join(" · "))}</div>` : ""}
      ${c.mentioned?.length ? `<div class="confirmed">📰 el artículo nombra: ${esc(c.mentioned.join(" · "))}</div>` : ""}
      ${c.countryMatch === false ? `<div class="diff">≠ país (${esc(c.country)})</div>` : ""}` })),
    manual: "Otro: pega una URL o MBID de artista",
  };
}

// What the post's text says it presents (data/post-context.json).
const VERSIONS = { original: "versión original", live: "en directo", acoustic: "acústica", remix: "remix", cover: "versión (cover)", demo: "demo", orchestral: "orquestal", other: "otra versión" };
function contextLine(c) {
  if (!c) return "";
  const parts = [
    c.subject && c.subject !== "song" && `trata de: ${c.subject}`,
    c.performer && `interpreta ${c.performer}`,
    c.version && c.version !== "original" && VERSIONS[c.version],
    c.version_detail, c.is_cover && `versión de ${c.original_artist ?? "otro artista"}`,
    c.featuring?.length && `con ${c.featuring.join(", ")}`, c.soundtrack_of && `BSO de ${c.soundtrack_of}`,
    c.album && `disco: ${c.album}`, c.year && `año: ${c.year}`,
  ].filter(Boolean);
  return `<p class="meta">📰 Según el artículo: <b>${esc(parts.join(" · ") || "versión original")}</b>${c.confidence && c.confidence !== "high" ? ` (confianza ${c.confidence === "low" ? "baja" : "media"})` : ""}</p>
    ${c.metadata_conflict ? `<p class="diff">≠ ${esc(c.metadata_conflict)}</p>` : ""}`;
}

function postView(k, r, chosen) {
  const q = encodeURIComponent([r.song, r.artist].filter(Boolean).join(" "));
  return {
    head: `<h2>${esc(r.title)} ${badge(k)}</h2>
      <p class="meta">${index + 1} de ${keys.length} · <a href="/archive/${esc(k)}.html" onclick="return false">${esc(k)}</a>
        · <a href="${MB}search?type=${r.song ? "recording" : "release_group"}&query=${q}" target="_blank" rel="noopener">buscar en MusicBrainz</a></p>
      <p class="meta">Artista: <b>${esc(r.artist)}</b> · Canción: <b>${esc(r.song || "—")}</b> · Disco: <b>${esc(r.album || "—")}</b> · Año: <b>${esc(r.year || "—")}</b></p>
      ${contextLine(r.context)}`,
    cands: r.candidates.map((c) => {
      const diffs = [
        r.song && c.title && norm(c.title) !== norm(r.song) && `título «${c.title}»`,
        r.album && c.album && norm(c.album) !== norm(r.album) && `disco «${c.album}»`,
      ].filter(Boolean);
      return { value: c.key, chosen: c.key === chosen, html: `
        <div><span class="name">${esc(c.title ?? "(solo disco)")}</span>
          ${c.recording ? `<a href="${MB}recording/${c.recording}" target="_blank" rel="noopener">↗</a>` : ""}
          · ${esc(c.album ?? "sin disco")} ${c.release_group ? `<a href="${MB}release-group/${c.release_group}" target="_blank" rel="noopener">↗</a>` : ""}</div>
        <div class="sub">${[c.disambiguation, [c.type, ...c.secondary].filter(Boolean).join(" + "), c.status !== "Official" && c.status, c.date, mmss(c.length), c.isrcs.length && "ISRC", c.paired && "disco buscado aparte", c.mentioned && "el artículo nombra el disco", `puntos ${c.points}`].filter(Boolean).map(esc).join(" · ")}</div>
        ${diffs.length ? `<div class="diff">≠ ${esc(diffs.join(" · "))}</div>` : ""}` };
    }),
    manual: "Otro: pega la URL de una grabación y/o un disco (release-group)",
  };
}

function render() {
  if (!keys.length) { $("#main").innerHTML = `<p class="empty">Nada en esta lista.</p>`; current = null; return; }
  const k = current = keys[index], r = R()[k];
  const v = (kind === "artists" ? artistView : postView)(k, r, chosenOf(k));
  $("#main").innerHTML = `${v.head}
    <div class="cands">${v.cands.map((c, i) => `
      <div class="cand ${c.chosen ? "chosen" : ""}">
        <span class="num">${i < 9 ? i + 1 : ""}</span>
        <div>${c.html}</div>
        <button data-i="${i}">Elegir</button>
      </div>`).join("") || `<p class="empty">Sin candidatos.</p>`}</div>
    <div class="actions">
      <input id="manual" placeholder="${v.manual}" autocomplete="off">
      <button id="useManual">Usar</button>
      <button id="none">Sin coincidencia (<kbd>0</kbd>)</button>
      ${k in D() ? `<button id="undo">Deshacer</button>` : ""}
    </div>
    <p class="msg" id="msg"></p>
    <p class="hint"><kbd>1</kbd>–<kbd>9</kbd> elegir · <kbd>0</kbd> sin coincidencia · <kbd>←</kbd> <kbd>→</kbd> moverse</p>`;
  document.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => decide(v.cands[b.dataset.i].value));
  $("#none").onclick = () => decide(null);
  $("#useManual").onclick = () => {
    const text = $("#manual").value;
    if (kind === "artists") {
      const m = text.match(UUID);
      return m ? decide(m[0]) : ($("#msg").textContent = "No veo un MBID en eso.");
    }
    // Posts: "recording/<id>" and/or "release-group/<id>" URLs, or a bare id (taken as the recording).
    const rec = text.match(new RegExp(`recording/(${UUID.source})`))?.[1], rg = text.match(new RegExp(`release-group/(${UUID.source})`))?.[1];
    const bare = !rec && !rg && text.match(UUID)?.[0];
    if (!rec && !rg && !bare) return ($("#msg").textContent = "No veo una URL de MusicBrainz en eso.");
    const key = `${rec ?? bare ?? ""}|${rg ?? ""}`;
    // Manual picks become a candidate, so --apply can find them.
    if (!r.candidates.some((c) => c.key === key)) r.candidates.push({ key, recording: rec ?? bare ?? null, release_group: rg ?? null, title: "(manual)", album: null, secondary: [], isrcs: [], points: 0, manual: true });
    decide(key, r.candidates.find((c) => c.key === key));
  };
  if ($("#undo")) $("#undo").onclick = () => decide(undefined);
}

async function decide(value, candidate) {
  await fetch("/api/decide", { method: "POST", body: JSON.stringify({ kind, key: current, value, candidate }) });
  if (value === undefined) delete D()[current]; else D()[current] = kind === "artists" ? { mbid: value } : { pick: value, ...(candidate?.manual ? { candidate } : {}) };
  // In "pending" the decided item leaves the list; elsewhere move to the next one.
  const filter = $("#filter").value;
  keys = list();
  if (filter !== "pending") index = Math.min(keys.indexOf(current) + 1, keys.length - 1);
  else index = Math.min(index, Math.max(keys.length - 1, 0));
  current = keys[index];
  stats(); render();
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || !current) return;
  const n = document.querySelectorAll("[data-i]").length;
  if (e.key === "ArrowRight") { index = Math.min(index + 1, keys.length - 1); current = keys[index]; render(); }
  else if (e.key === "ArrowLeft") { index = Math.max(index - 1, 0); current = keys[index]; render(); }
  else if (e.key === "0") decide(null);
  else if (/^[1-9]$/.test(e.key) && e.key <= n) document.querySelector(`[data-i="${e.key - 1}"]`).click();
});
document.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => {
  kind = b.dataset.kind; history.replaceState(null, "", `?kind=${kind}`);
  index = 0; current = null; keys = list(); tabs(); stats(); render();
});
$("#filter").onchange = () => { index = 0; current = null; keys = list(); render(); };
load();
</script>
</body>
</html>
