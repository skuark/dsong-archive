<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisar vídeos · dSong</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e2e0da; --accent: #c2410c; --ok: #15803d; --no: #b91c1c; --warn: #b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --card: #202020; --text: #ececec; --muted: #9a9a9f; --line: #333; --accent: #fb923c; --ok: #4ade80; --no: #f87171; --warn: #fbbf24; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; }
  .stats { color: var(--muted); font-variant-numeric: tabular-nums; }
  select, input, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }
  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .ref { position: sticky; top: 70px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 900px) { .ref { position: static; } }
  .ref h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; }
  .ref .label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .ref iframe { width: 100%; border: 0; border-radius: 8px; display: block; }
  .ref audio { width: 100%; }
  .ref .none { color: var(--muted); font-size: 14px; }
  .ref .facts { font-size: 13px; color: var(--muted); }
  .query { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 16px; }
  .meta a { color: var(--accent); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; font-size: 12px; margin-left: 6px; vertical-align: middle; font-weight: 500; }
  .badge.ok { color: var(--ok); } .badge.no { color: var(--no); } .badge.warn { color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .cand { background: var(--card); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .cand.chosen { border-color: var(--ok); }
  .player { aspect-ratio: 16/9; background: #000; position: relative; cursor: pointer; }
  .player img, .player iframe { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
  .player .play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; color: #fff; text-shadow: 0 2px 8px #000; }
  .info { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .title { font-weight: 600; }
  .channel, .score { color: var(--muted); font-size: 13px; }
  .info button { margin-top: auto; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .actions input { flex: 1; min-width: 220px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 18px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .msg { color: var(--no); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Revisar vídeos</h1>
  <select id="filter">
    <option value="todo">Pendientes y dudosos</option>
    <option value="pending">Solo pendientes</option>
    <option value="doubtful">Solo dudosos</option>
    <option value="decided">Ya revisados</option>
    <option value="auto">Automáticos</option>
    <option value="all">Todos</option>
  </select>
  <span class="stats" id="stats"></span>
</header>
<main id="main"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s = "") => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let results = {}, decisions = {}, players = {}, ids = [], index = 0, currentId = null;

const REASONS = { topic: "canal Topic", rescore: "canal oficial", itunes: "duración iTunes", spotify: "duración Spotify", content: "enlace del artículo", live: "directo mencionado", deep: "búsqueda afinada" };

// Candidates come as "ID [score or reason] title · channel".
const parse = (s) => {
  const m = s.match(/^(\S+) \[([^\]]+)\] (.*) · (.*)$/);
  return m ? { id: m[1], score: m[2], title: m[3], channel: m[4] } : { id: s.split(" ")[0], score: "", title: s, channel: "" };
};

// Unique candidates (passes that add a pick put it first, so it may appear twice).
const candsOf = (id) => results[id].candidates.map(parse).filter((c, i, all) => all.findIndex((o) => o.id === c.id) === i);

function list() {
  const f = $("#filter").value;
  return Object.keys(results).filter((id) => {
    const r = results[id], d = id in decisions;
    const pending = r.status === "review" && !d, doubtful = r.doubtful && !d;
    if (f === "todo") return pending || doubtful;
    if (f === "pending") return pending;
    if (f === "doubtful") return doubtful;
    if (f === "decided") return d;
    if (f === "auto") return r.status === "auto";
    return true;
  });
}

async function load() {
  const data = await (await fetch("/api/data")).json();
  results = data.results; decisions = data.decisions; players = data.players;
  ids = list();
  index = currentId && ids.includes(currentId) ? ids.indexOf(currentId) : Math.min(index, Math.max(ids.length - 1, 0));
  stats();
  // Don't re-render while something is playing.
  if (!document.querySelector(".cand iframe") && !playing()) render();
}

const playing = () => [...document.querySelectorAll("audio")].some((a) => !a.paused);

function stats() {
  const keys = Object.keys(results);
  const left = keys.filter((id) => (results[id].status === "review" || results[id].doubtful) && !(id in decisions)).length;
  $("#stats").textContent = `${left} por revisar · ${Object.keys(decisions).length} decisiones · ${keys.length} posts`;
}

function reference(id) {
  const r = results[id], list = players[id] ?? [];
  const facts = [r.spotify && `Spotify: ${esc(r.spotify)}`, r.itunes && `iTunes: ${esc(r.itunes)}`].filter(Boolean).join("<br>");
  return `<aside class="ref">
    <h2>Lo que ya tiene el post</h2>
    ${list.length ? list.map((p) => `<div><div class="label">${p.label}</div>${p.type === "audio"
      ? `<audio controls preload="none" src="${esc(p.src)}"></audio>`
      : `<iframe src="${esc(p.src)}" height="${p.height}" allow="autoplay; encrypted-media; clipboard-write" loading="lazy"></iframe>`}</div>`).join("")
      : `<p class="none">Este post no tiene otros reproductores.</p>`}
    ${facts ? `<p class="facts">${facts}</p>` : ""}
  </aside>`;
}

function render() {
  currentId = ids[index] ?? null;
  if (!currentId) { $("#main").innerHTML = `<p class="empty">No queda nada en este filtro. 🎉</p>`; return; }
  const r = results[currentId], d = decisions[currentId];
  const cands = candsOf(currentId);
  const chosen = d ? d.pick : r.status === "auto" ? r.pick : undefined;
  const badges = [
    d ? (d.pick ? `<span class="badge ok">elegido</span>` : `<span class="badge no">ninguno</span>`) : "",
    r.doubtful && !d ? `<span class="badge warn">dudoso</span>` : "",
  ].join("");
  $("#main").innerHTML = `
    <p class="query">${esc(r.query)}${badges}</p>
    <p class="meta">${index + 1} de ${ids.length} · ${r.status}${r.reason ? ` (${REASONS[r.reason] ?? r.reason})` : ""} ·
      <a href="https://dsong.es/archive/${currentId}.html" target="_blank">ver post</a> ·
      <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(r.query)}" target="_blank">buscar en YouTube</a></p>
    <div class="layout">
      ${reference(currentId)}
      <section>
        <div class="grid">${cands.map((c, i) => `
          <div class="cand ${c.id === chosen ? "chosen" : ""}">
            <div class="player" data-id="${esc(c.id)}"><img src="https://i.ytimg.com/vi/${esc(c.id)}/mqdefault.jpg" alt=""><span class="play">▶</span></div>
            <div class="info">
              <span class="title">${esc(c.title)}</span>
              <span class="channel">${esc(c.channel)}</span>
              <span class="score">${/^-?\d+$/.test(c.score) ? `puntuación ${c.score}` : esc(REASONS[c.score] ?? c.score)}${c.id === chosen && !d ? " · elegido ahora" : ""}</span>
              <button data-pick="${esc(c.id)}">${c.id === chosen && !d ? "Confirmar" : "Elegir"} <kbd>${i + 1}</kbd></button>
            </div>
          </div>`).join("")}
        </div>
        <div class="actions">
          <button data-pick="">Ninguno vale <kbd>X</kbd></button>
          <input id="custom" placeholder="Otro vídeo: URL o ID de YouTube">
          <button id="useCustom">Usar</button>
          <span class="msg" id="msg"></span>
        </div>
        <div class="actions">
          <button id="undo">Deshacer <kbd>U</kbd></button>
          <button id="prev">← Anterior</button>
          <button id="next">Siguiente →</button>
        </div>
        <p class="hint">Clic en la miniatura para reproducir. Teclas: <kbd>1</kbd>–<kbd>${cands.length}</kbd> elegir · <kbd>X</kbd> ninguno · <kbd>←</kbd> <kbd>→</kbd> navegar · <kbd>U</kbd> deshacer</p>
      </section>
    </div>`;
}

async function decide(pick) {
  if (!currentId) return;
  await fetch("/api/decide", { method: "POST", body: JSON.stringify({ id: currentId, pick }) });
  if (pick === undefined) delete decisions[currentId]; else decisions[currentId] = { pick };
  const before = index;
  ids = list();
  // In filters that hide decided items, the same index is already the next one.
  index = ids.includes(currentId) ? Math.min(ids.indexOf(currentId) + 1, ids.length - 1) : Math.min(before, Math.max(ids.length - 1, 0));
  stats(); render();
}

const ytId = (s) => (s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || s.match(/^([\w-]{11})$/) || [])[1];
const move = (n) => { index = Math.max(0, Math.min(ids.length - 1, index + n)); render(); };

document.addEventListener("click", (e) => {
  const player = e.target.closest(".player");
  if (player && !player.querySelector("iframe")) {
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${player.dataset.id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    return;
  }
  const btn = e.target.closest("button");
  if (!btn) return;
  if ("pick" in btn.dataset) decide(btn.dataset.pick || null);
  else if (btn.id === "useCustom") { const id = ytId($("#custom").value.trim()); id ? decide(id) : ($("#msg").textContent = "No reconozco esa URL o ID"); }
  else if (btn.id === "undo") decide(undefined);
  else if (btn.id === "prev") move(-1);
  else if (btn.id === "next") move(1);
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const cands = currentId ? candsOf(currentId) : [];
  if (/^[1-9]$/.test(e.key) && cands[e.key - 1]) decide(cands[e.key - 1].id);
  else if (e.key.toLowerCase() === "x") decide(null);
  else if (e.key.toLowerCase() === "u") decide(undefined);
  else if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
});

$("#filter").addEventListener("change", () => { index = 0; currentId = null; ids = list(); render(); });
load();
setInterval(load, 30000);
</script>
</body>
</html>
